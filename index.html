<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>squaremap section viewer</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    html, body, #map { height: 100%; margin: 0; background: #1a1a1a; }

    /* Google-Maps-style subnational-border label: plain text, no bubble. */
    .town-label {
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
      padding: 0 !important;
      color: #ccc;
      font: 600 11px/1.2 "Segoe UI", sans-serif;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      text-shadow: 0 0 3px #000, 0 0 3px #000, 0 0 3px #000;
      white-space: nowrap;
      pointer-events: none;
    }
    .town-label::before { display: none !important; }
  </style>
</head>
<body>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/squaremap-crs.js"></script>
  <script src="js/town-borders.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
