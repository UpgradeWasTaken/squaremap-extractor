<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>squaremap section viewer</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    html, body, #map { height: 100%; margin: 0; background: #1a1a1a; }

    /* Zoom 6 and 7 upscale the zoom-5 tiles; keep the blocks sharp-edged
       instead of letting the browser smooth them. */
    .leaflet-tile {
      image-rendering: crisp-edges;
      image-rendering: pixelated;
    }

    /* Google-Maps-style subnational-border label: plain text, no bubble. */
    .map-label {
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
      padding: 0 !important;
      text-align: center;
      text-shadow: 0 0 3px #000, 0 0 3px #000, 0 0 3px #000;
      white-space: nowrap;
      pointer-events: none;
    }
    .map-label::before { display: none !important; }

    .town-label {
      color: #ededed;
      font: 700 13px/1.2 "Segoe UI", sans-serif;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    /* Subdivisions sit inside a town, so they read one step quieter. */
    .subdivision-label {
      color: #c4c4c4;
      font: 500 10px/1.2 "Segoe UI", sans-serif;
      letter-spacing: 0.3px;
    }

    .label-alt {
      display: block;
      font-size: 8.5px;
      font-weight: 400;
      opacity: 0.85;
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/squaremap-crs.js"></script>
  <script src="js/town-geometry.js"></script>
  <script src="js/town-borders.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
